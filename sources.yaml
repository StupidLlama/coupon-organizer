# 線索來源：會整理很多店家優惠的部落格／媒體。一個網址可以對應很多家店（包含官網抓不到的店，例如全家、摩斯）。
# - 程式只挑「標題有優惠字眼、之前沒看過」的新文章，最多 max_articles 篇合併成一次 Gemini 呼叫。
# - Gemini 只抽出事實（店家、品項、價格、日期）並自己改寫，網站上會標「情報來源」並附原文連結，不轉貼原文和圖片。
# - every: daily（每天）或 weekly（每週一）。url 留空 = 暫停。
# - 這些網站都寫「僅供參考」，網站上會提醒「以官方公告為準」，也可以用回報按鈕回報錯誤。
tips:
  infotalk: { name: 好康情報誌, url: "https://info.talk.tw/feed/", every: daily, max_articles: 3 }
  applealmond: { name: 蘋果仁, url: "https://applealmond.com/feed", every: daily, max_articles: 2 }  # RSS 混很多科技新聞，靠標題關鍵字篩
  beauty321: { name: 美麗佳人, url: "https://www.beauty321.com/rss", every: daily, max_articles: 2 }
  supertaste: { name: 食尚玩家, url: "https://supertaste.tvbs.com.tw/pack", every: daily, max_articles: 2 }  # 懶人包列表頁（不是 RSS）
  businesstoday: { name: 今周刊, url: "https://www.businesstoday.com.tw/catalog/183030/", every: weekly, max_articles: 2 }  # 生活消費分類，網址待實測
  sogi: { name: SOGI 手機王, url: "", every: weekly, max_articles: 2 }  # 暫停：行動支付優惠整理，還沒找到固定的列表頁
