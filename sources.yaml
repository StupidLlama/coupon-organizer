# 優惠夾：店家清單與抓取來源
# - 每家店的 urls 是自動更新時要抓的網頁（各店的「優惠／活動／最新消息」頁）。每多一個網址，每天就多一次 Gemini 呼叫。
# - urls: [] = 暫停抓取（找不到合規、抓得到的官方來源），店家和已有的優惠會保留。
# - 換網址後可以用 python scripts/check_urls.py 測試抓不抓得到。
# - 很多網站是用 JavaScript 動態載入，純抓 HTML 可能拿不到內容；抓不到的店家會在 Actions 紀錄裡顯示「沒有文字」。
# - sub 必須是下面 categories 裡的子分類代號。
# - 選填 app_ios / app_android：App Store / Google Play 的下載頁網址。填了之後，「App 限定」的優惠詳情會出現「開啟 App」按鈕。
# - 選填 window：只在這個台灣時段抓（例 "12:00-16:45"），給 robots.txt 有 Visit-time 的網站用。時段外會略過；目前沒有店家使用（中午排程已移除，見 HANDOFF）。
# - 選填 follow / max_follow：優惠只放圖片、文字在內頁的網站用。會抓 urls 頁面上網址含 follow 字串的連結（最多 max_follow 個，預設 5），合併成一次 Gemini 呼叫。
#   例：mcd: { ..., app_ios: "https://apps.apple.com/tw/app/...", app_android: "https://play.google.com/store/apps/details?id=..." }

settings:
  model: auto                  # auto = 每次自動挑最新的穩定 flash 模型；也可以填固定名稱（填錯或被停用時會自動改用 auto）
  request_gap_seconds: 15      # 每次呼叫 Gemini 間隔幾秒，避免超過免費額度的每分鐘上限
  max_chars_per_page: 15000    # 每個網頁最多送多少字給 Gemini
  max_minutes: 22              # 抓取最多跑幾分鐘，超過就先存檔結束（Actions 30 分鐘會強制取消，取消的話整次結果都不會存）
  stale_days: 14               # 自動抓到的優惠，超過幾天沒再出現就移除
  tip_days: 7                  # 線索來源（部落格）的優惠，沒寫到期日的保留幾天（有到期日的保留到到期日）
  keep_demo: true              # true = 保留示範資料；有真實資料後改成 false
  report_form: ""              # 「回報錯誤」Google 表單的預先填入連結（優惠代號填 ID123、店家填 STORE），之後網站按鈕會用
  report_csv: ""               # 表單回覆試算表「發布到網路」的 CSV 網址；每週一 scripts/reports.py 會整理成 Issue

categories:
  food: { name: 美食, subs: { fast: 速食, drink: 飲料咖啡, delivery: 外送, dine: 餐廳 } }
