# 優惠夾：店家清單與抓取來源
# - 每家店的 urls 是自動更新時要抓的網頁。目前先放官網首頁，之後請換成各店的「優惠／活動」頁面，抓到的資料會準很多。
# - 很多網站是用 JavaScript 動態載入，純抓 HTML 可能拿不到內容；抓不到的店家會在 Actions 紀錄裡顯示「沒有文字」。
# - sub 必須是下面 categories 裡的子分類代號。
# - 選填 app_ios / app_android：App Store / Google Play 的下載頁網址。填了之後，「App 限定」的優惠詳情會出現「開啟 App」按鈕。
#   例：mcd: { ..., app_ios: "https://apps.apple.com/tw/app/...", app_android: "https://play.google.com/store/apps/details?id=..." }

settings:
  model: gemini-2.5-flash      # Gemini 模型名稱；若 Google 改版停用，換成目前免費額度可用的 flash 模型
  request_gap_seconds: 7       # 每次呼叫 Gemini 間隔幾秒，避免超過免費額度的每分鐘上限
  max_chars_per_page: 15000    # 每個網頁最多送多少字給 Gemini
  stale_days: 14               # 自動抓到的優惠，超過幾天沒再出現就移除
  keep_demo: true              # true = 保留示範資料；有真實資料後改成 false

categories:
  food: { name: 美食, subs: { fast: 速食, drink: 飲料咖啡, delivery: 外送, dine: 餐廳 } }
  shop: { name: 購物, subs: { mart: 超商量販, daily: 日用美妝, tech: 電子產品, online: 網購平台 } }
  svc: { name: 服務訂閱, subs: { stream: 影音串流, music: 音樂, ai: AI 與軟體, telecom: 電信網路 } }
  travel: { name: 交通旅遊, subs: { transit: 交通, stay: 住宿 } }
  fun: { name: 娛樂, subs: { movie: 電影, game: 遊戲 } }
  pay: { name: 金融支付, subs: { wallet: 行動支付, card: 信用卡 } }

