<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>優惠夾</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: white page. Header (search + profile) → view tabs (探索 / 為你推薦 / 我的優惠夾).
   探索 = filter rail + results grouped by company. Signature: yellow price-tag for days left; red 已使用 stamp. Single light theme by request. */
:root{
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#ffffff; --ink:#1b1f24; --soft:#646c75; --rule:#e7e9ec; --wash:#f5f6f7;
  --tag:#ffd43b; --tag-ink:#3d3000; --hot:#e0352b; --sel:#1b1f24;
  --f-disp:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--rule)}
.head{display:flex;align-items:center;gap:16px 20px;padding-block:14px 10px;flex-wrap:wrap}
.mark{font-family:var(--f-disp);font-weight:900;font-size:24px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none}
.mark svg{width:30px;height:30px}
.search{flex:1 1 280px;min-width:0;display:flex;align-items:center;gap:10px;background:var(--wash);border-radius:12px;padding:0 14px;border:1.5px solid transparent}
.search:focus-within{border-color:var(--ink);background:var(--paper)}
.search svg{width:18px;height:18px;flex:none;stroke:var(--soft)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;padding:11px 0;color:var(--ink);outline:none}
.me{border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13.5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.me b{font-weight:700}
@media (max-width:640px){header{position:static}.head{gap:10px}.me{margin-left:auto;padding:5px 12px;font-size:12.5px}.search{order:3;flex-basis:100%}.search input{padding:9px 0}}
.views{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.view{font-family:var(--f-disp);font-weight:700;font-size:16px;text-decoration:none;padding:8px 12px 10px;border-bottom:3px solid transparent;color:var(--soft);white-space:nowrap}
.view small{font-family:var(--f-body);font-weight:500;font-size:12px;background:var(--wash);border-radius:999px;padding:1px 7px;margin-left:5px;color:var(--ink)}
.view[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.note{font-size:12.5px;color:var(--soft);padding-block:8px;background:var(--wash)}
.note b{background:var(--tag);color:var(--tag-ink);padding:1px 6px;border-radius:4px;font-weight:700;margin-right:6px}

/* profile panel */
.profile{border-bottom:1px solid var(--rule);background:var(--paper)}
.profile .wrap{padding-block:18px 20px;display:flex;flex-direction:column;gap:12px}
.profile h2{font-family:var(--f-disp);font-size:20px;margin:0}
.profile p{margin:0;color:var(--soft);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:9px;padding:8px 18px;cursor:pointer;font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--rule)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:40px;padding-block:24px 64px}
.shell.single{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:12px 48px}}

/* rail */
.rail{display:flex;flex-direction:column;gap:28px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);align-self:start;max-height:calc(100vh - 150px);overflow:auto;padding-right:4px}
@media (max-width:860px){.rail{position:static;max-height:none;overflow:visible;gap:12px}}
.rail h2,.fgroup h2{font-family:var(--f-disp);font-size:14px;font-weight:700;margin:0 0 10px;color:var(--soft)}
.cats{display:flex;flex-direction:column;gap:2px}
.cat{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-family:var(--f-disp);font-weight:700;font-size:16px}
.cat small{font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.cat:hover{background:var(--wash)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cat[aria-pressed="true"] small{color:inherit;opacity:.7}
.subs{display:flex;flex-direction:column;gap:1px;margin:4px 0 8px 12px;padding-left:10px;border-left:2px solid var(--rule)}
.sub{border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--soft);display:flex;justify-content:space-between}
.sub[aria-pressed="true"]{color:var(--ink);font-weight:700;background:var(--wash)}
.sub small{font-variant-numeric:tabular-nums}
.strip{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
@media (max-width:860px){.strip{display:flex}.cats-block{display:none}}

.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup h2{margin:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--rule);background:var(--paper);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.opt:hover{border-color:var(--soft)}
.opt[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--paper)}
.hint{font-size:12px;color:var(--soft);margin:0}
details.filt{display:contents}
details.filt>summary{display:none}
.fbody{display:flex;flex-direction:column;gap:24px}
@media (max-width:860px){
  details.filt{display:block;border:1.5px solid var(--rule);border-radius:12px;padding:10px 14px}
  details.filt>summary{display:flex;justify-content:space-between;cursor:pointer;list-style:none;font-weight:700}
  details.filt>summary::-webkit-details-marker{display:none}
  details.filt[open]>summary{margin-bottom:14px}
  .fbody{gap:18px}
}

/* results top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.top h1{font-family:var(--f-disp);font-size:clamp(24px,4vw,34px);font-weight:900;margin:0;line-height:1.15;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--soft);font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;font-size:13.5px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink)}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px}
.active:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--wash);border:0;border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;cursor:pointer}
.pill span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--rule);font-size:11px}
.clear{border:0;background:none;font-size:13px;color:var(--soft);text-decoration:underline;cursor:pointer;padding:4px}
.report{font-size:13.5px;color:var(--soft)}
.report a{color:var(--ink);font-weight:700}

/* shelves */
.shelves{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.shelf{border-top:2px solid var(--ink);padding-block:14px 16px}
.shelf-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:10px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:17px;color:#fff;border:1px solid var(--rule)}
.logo.sm{width:24px;height:24px;border-radius:6px;font-size:11px}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:12%}
.shelf-head h2{font-family:var(--f-disp);font-size:20px;font-weight:900;margin:0;line-height:1.2}
.shelf-head .meta{font-size:13px;color:var(--soft)}
.shelf-head .count{margin-left:auto;font-size:13px;white-space:nowrap;color:var(--soft);font-variant-numeric:tabular-nums}
.shelf-head .count b{font-family:var(--f-disp);font-size:20px;color:var(--ink);margin-right:2px}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.section-h{font-family:var(--f-disp);font-size:20px;font-weight:900;margin:28px 0 12px;display:flex;align-items:baseline;gap:8px}
.section-h small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--soft)}

/* ticket */
.tk{position:relative;border:1.5px solid var(--rule);border-radius:12px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--paper)}
.tk::before,.tk::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1.5px solid var(--rule);transform:translateY(-50%)}
.tk::before{left:-8px;clip-path:inset(0 0 0 50%)}
.tk::after{right:-8px;clip-path:inset(0 50% 0 0)}
.tk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.who{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;min-width:0}
.type{font-size:12.5px;color:var(--soft);font-weight:500;white-space:nowrap}
.days{font-family:var(--f-disp);font-weight:700;font-size:12.5px;background:var(--tag);color:var(--tag-ink);padding:2px 9px 2px 12px;border-radius:3px 6px 6px 3px;position:relative;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.days::before{content:"";position:absolute;left:4px;top:50%;width:4px;height:4px;border-radius:50%;background:var(--paper);transform:translateY(-50%)}
.tk.hot .days{background:var(--hot);color:#fff}
.tk h3{margin:0;font-size:16px;font-weight:700;line-height:1.4;text-wrap:balance}
.tk p{margin:0;font-size:13px;color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tg{font-size:11.5px;border:1px solid var(--rule);border-radius:5px;padding:1px 7px;color:var(--soft)}
.tg.match{border-color:var(--tag);background:var(--tag);color:var(--tag-ink)}
.tg.demo{border-style:dashed}
.tk-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1.5px dashed var(--rule);flex-wrap:wrap}
.code{border:1.5px dashed var(--ink);background:none;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;cursor:pointer}
.exp{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.acts{margin-left:auto;display:flex;align-items:center;gap:4px}
.use{border:1.5px solid var(--rule);background:none;border-radius:7px;padding:2px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.use:hover{border-color:var(--ink)}
.star{border:0;background:none;cursor:pointer;padding:3px;display:grid;place-items:center}
.star svg{width:20px;height:20px;fill:none;stroke:var(--soft);stroke-width:1.8}
.star[aria-pressed="true"] svg{fill:var(--tag);stroke:var(--tag-ink)}
.links{display:flex;gap:14px;font-size:12px;color:var(--soft)}
.links a{color:var(--soft)}

/* used */
.tk.used{background:var(--wash);border-color:var(--wash)}
.tk.used::before,.tk.used::after{border-color:var(--wash)}
.tk.used>*:not(.stamp):not(.tk-foot){filter:grayscale(1);opacity:.5}
.tk.used .tk-foot>*:not(.acts){filter:grayscale(1);opacity:.5}
.tk.used .days{background:var(--rule);color:var(--soft)}
.stamp{position:absolute;right:18px;top:38%;transform:rotate(-14deg);border:3px solid var(--hot);color:var(--hot);font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.12em;padding:2px 12px 2px 14px;border-radius:8px;pointer-events:none;opacity:.88;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3.5px var(--hot)}

.tk{cursor:pointer}
.tk:hover{border-color:var(--soft)}
.tk.used:hover{border-color:var(--rule)}
.tk h3 a{text-decoration:none}

/* detail sheet: right panel on desktop, bottom sheet on phone */
.sheet{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(27,31,36,.38)}
.panel{position:relative;width:min(500px,100%);height:100%;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) 22px;
  display:flex;flex-direction:column;gap:18px;box-shadow:-12px 0 40px rgba(27,31,36,.12)}
@media (max-width:640px){
  /* phone: detail takes the whole screen, with a sticky top bar for the close button */
  .scrim{display:none}
  .panel{width:100%;height:100%;height:100dvh;border-radius:0;box-shadow:none;padding-top:0;
    padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .p-top{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--rule);
    margin:0 calc(-1 * max(18px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(18px,env(safe-area-inset-left,0px)));
    padding:calc(env(safe-area-inset-top,0px) + 12px) max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px))}
}
.p-top{display:flex;align-items:center;gap:12px}
.p-top .nm{font-family:var(--f-disp);font-weight:900;font-size:18px;line-height:1.2}
.p-top .sb{font-size:13px;color:var(--soft)}
.x{margin-left:auto;border:0;background:var(--wash);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;flex:none}
.p-title{font-family:var(--f-disp);font-size:clamp(22px,5vw,26px);font-weight:900;line-height:1.3;margin:0;text-wrap:balance}
.p-desc{margin:0;color:var(--soft)}
.period{border:1.5px solid var(--rule);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.period-ends{display:flex;justify-content:space-between;gap:12px}
.period-ends div{display:flex;flex-direction:column}
.period-ends div:last-child{text-align:right}
.period small{font-size:12px;color:var(--soft)}
.period b{font-size:15px;font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;border-radius:4px;background:var(--wash)}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ink)}
.bar i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--tag);border:2.5px solid var(--ink);transform:translate(-50%,-50%)}
.bar.hot span{background:var(--hot)}
.period .left{font-family:var(--f-disp);font-weight:700;font-size:14px}
.period .left.hot{color:var(--hot)}
.acts-big{display:flex;flex-direction:column;gap:8px}
.big{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15.5px;cursor:pointer;border:0;text-align:center}
.big.primary{background:var(--ink);color:var(--paper)}
.big.secondary{background:var(--paper);color:var(--ink);border:1.5px solid var(--rule)}
.codebox{display:flex;align-items:center;gap:10px;border:2px dashed var(--ink);border-radius:12px;padding:10px 12px 10px 16px}
.codebox code{font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.08em;flex:1;min-width:0;overflow-wrap:anywhere}
.codebox button{border:0;background:var(--tag);color:var(--tag-ink);border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.p-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-row .use{padding:6px 12px;font-size:13.5px}
.p-row .star{border:1.5px solid var(--rule);border-radius:8px;padding:5px 10px;display:flex;gap:6px;align-items:center;font-size:13.5px}
.p-meta{font-size:12.5px;color:var(--soft);display:flex;flex-wrap:wrap;gap:4px 14px}
.p-meta a{color:var(--soft)}
.p-used{border:2px solid var(--hot);color:var(--hot);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.rel h3{font-family:var(--f-disp);font-size:16px;margin:0 0 8px}
.rel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rel li a{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--rule);text-decoration:none;min-width:0}
.rel li .t{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel li .t small{display:block;color:var(--soft);font-size:12px}
.rel .days{font-size:11.5px}

.empty{border:1.5px dashed var(--rule);border-radius:14px;padding:40px 20px;text-align:center;color:var(--soft);margin-top:20px}
.empty b{display:block;font-family:var(--f-disp);font-size:18px;color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{border-top:1px solid var(--rule);color:var(--soft);font-size:12.5px}
footer .wrap{padding-block:18px 28px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <a class="mark" href="#explore">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 9a3 3 0 0 1 3-3h18a3 3 0 0 1 3 3v3.5a3.5 3.5 0 0 0 0 7V23a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-3.5a3.5 3.5 0 0 0 0-7z" fill="#ffd43b" stroke="#1b1f24" stroke-width="2"/><path d="M20 8v16" stroke="#1b1f24" stroke-width="2" stroke-dasharray="2.5 2.5"/></svg>
      優惠夾
    </a>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="搜尋店家、商品或優惠，例如：星巴克、AirPods" autocomplete="off">
    </label>
    <button class="me" id="meBtn" aria-expanded="false" aria-controls="profile"></button>
  </div>
  <nav class="wrap views" aria-label="頁面">
    <a class="view" href="#explore" data-v="explore">探索</a>
    <a class="view" href="#for-you" data-v="for-you">為你推薦</a>
    <a class="view" href="#wallet" data-v="wallet">我的優惠夾<small id="walletN">0</small></a>
  </nav>
</header>

<section class="profile" id="profile" hidden>
  <div class="wrap">
    <h2>你是哪一種使用者？</h2>
    <p>可以選多個。我們會在「為你推薦」優先列出專屬你的優惠，設定只存在這台裝置上。</p>
    <div class="opts" id="pf-opts"></div>
    <div class="row"><button class="btn" id="pf-save">儲存身分</button><button class="btn ghost" id="pf-cancel">取消</button></div>
  </div>
</section>

<div class="note"><div class="wrap" id="note"><b>示範版</b>目前的優惠多為虛構示範資料，標有「示範」字樣。</div></div>

<div class="wrap shell" id="shell">
  <aside class="rail" id="rail">
    <div class="strip" id="strip"></div>
    <section class="cats-block">
      <h2>分類</h2>
      <div class="cats" id="cats"></div>
    </section>
    <details class="filt" id="filt">
      <summary><span>篩選條件</span><span id="fcount"></span></summary>
      <div class="fbody">
        <section class="fgroup"><h2>適合誰</h2><div class="opts" id="f-aud"></div><p class="hint">選多個時，只顯示同時符合全部對象的優惠。</p></section>
        <section class="fgroup"><h2>使用條件</h2><div class="opts" id="f-cond"></div></section>
        <section class="fgroup"><h2>優惠類型</h2><div class="opts" id="f-type"></div></section>
      </div>
    </details>
  </aside>
  <main id="main"><div class="empty"><b>正在載入優惠…</b></div></main>
</div>

<footer><div class="wrap" id="foot"></div></footer>
<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-act="close"></div>
  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" tabindex="-1"></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const REPO='StupidLlama/coupon-organizer';   // 回報按鈕會開這個 repo 的 Issue 表單
const AUD={student:'學生',worker:'上班族',startup:'新創・企業',family:'家庭',senior:'長者',newbie:'新用戶'};
const COND={member:'會員限定',app:'App 限定',line:'LINE 限定',pay:'指定支付',bundle:'綁約限定',store:'門市限定'};
const TYPE={coupon:'優惠券',sale:'特價',event:'活動',trial:'免費試用',cashback:'點數回饋',plan:'方案折扣'};

const ls={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const st={view:'explore',q:'',cat:'all',sub:'all',aud:new Set(),cond:new Set(),type:null,sort:'exp',
  fav:new Set(ls.get('fav',[])),used:new Set(ls.get('used',[])),me:ls.get('me',null),draft:new Set()};
let DATA=null,CATS=[],S={},SUB2CAT={},SUBNAME={},deals=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAR='<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" stroke-linejoin="round"/></svg>';

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function daysLeft(end){if(!end)return null;return Math.round((Date.parse(end)-Date.parse(todayStr()))/864e5)}

function prepare(data){
  DATA=data;S=data.stores;
  CATS=Object.entries(data.categories).map(([id,c])=>({id,name:c.name,subs:Object.entries(c.subs)}));
  CATS.forEach(c=>c.subs.forEach(([s,n])=>{SUB2CAT[s]=c.id;SUBNAME[s]=n}));
  deals=data.coupons.map(c=>({...c,days:daysLeft(c.end),cname:S[c.store]?.name||c.store,sub:S[c.store]?.sub,cat:SUB2CAT[S[c.store]?.sub]}))
    .filter(c=>S[c.store]&&(c.days===null||c.days>=0));
}
const saveMarks=()=>{ls.set('fav',[...st.fav]);ls.set('used',[...st.used])};
const isUsed=d=>st.used.has(d.id);
const dsort=(a,b)=>(isUsed(a)-isUsed(b))||((a.days??1e4)-(b.days??1e4));

// 嚴格篩選：選到的每個對象、每個條件都要符合；類型單選
function matchSearch(d){
  if(!st.q)return true;
  const h=[d.cname,d.title,d.desc,SUBNAME[d.sub],TYPE[d.type],...d.aud.map(a=>AUD[a]),...d.cond.map(c=>COND[c])].join(' ').toLowerCase();
  return st.q.toLowerCase().split(/\s+/).every(w=>h.includes(w));
}
function matchFilters(d){
  for(const a of st.aud)if(!d.aud.includes(a))return false;
  for(const c of st.cond)if(!d.cond.includes(c))return false;
  return !st.type||d.type===st.type;
}

function logo(store,sm){
  const s=S[store];const init=esc(s.name.replace(/^[^\p{L}\p{N}]+/u,'').slice(0,1).toUpperCase());
  return `<span class="logo${sm?' sm':''}" style="background:${esc(s.color)}">${init}<img alt="" loading="lazy" src="https://www.google.com/s2/favicons?domain=${esc(s.domain)}&sz=128" onerror="this.remove()"></span>`;
}
function ticket(d,{showStore=false,matchAud=null}={}){
  const used=isUsed(d),fav=st.fav.has(d.id);
  const left=d.days===null?'長期':d.days===0?'今天截止':`剩 ${d.days} 天`;
  const end=d.end?`${+d.end.slice(5,7)}/${+d.end.slice(8,10)} 到期`:'無期限';
  const expUrl=`https://github.com/${REPO}/issues/new?template=expired.yml&title=${encodeURIComponent('[已失效] '+d.cname+' '+d.title)}&coupon_id=${d.id}`;
  return `<article class="tk${d.days!==null&&d.days<=3&&!used?' hot':''}${used?' used':''}" data-open="${d.id}">
    <div class="tk-top">${showStore?`<span class="who">${logo(d.store,true)}${esc(d.cname)}</span>`:`<span class="type">${TYPE[d.type]}</span>`}<span class="days">${used?'已用':left}</span></div>
    <h3><a href="#c-${d.id}">${esc(d.title)}</a></h3>${d.desc?`<p>${esc(d.desc)}</p>`:''}
    <div class="tags">${showStore?`<span class="tg">${TYPE[d.type]}</span>`:''}${d.aud.map(a=>`<span class="tg${matchAud&&matchAud.has(a)?' match':''}">${AUD[a]}</span>`).join('')}${d.cond.map(c=>`<span class="tg">${COND[c]}</span>`).join('')}${d.origin==='demo'?'<span class="tg demo">示範</span>':''}</div>
    <div class="tk-foot">${d.code?`<button class="code" data-code="${esc(d.code)}" title="複製優惠碼">${esc(d.code)}</button>`:''}<span class="exp">${end}</span>
      <span class="acts"><button class="use" data-use="${d.id}">${used?'復原':'標記已使用'}</button>
      <button class="star" data-star="${d.id}" aria-pressed="${fav}" aria-label="${fav?'取消收藏':'收藏'}">${STAR}</button></span></div>
    <div class="links">${d.source?`<a href="${esc(d.source)}" target="_blank" rel="noopener">查看來源</a>`:''}<a href="${expUrl}" target="_blank" rel="noopener">回報失效</a></div>
    ${used?'<span class="stamp" aria-hidden="true">已使用</span>':''}
  </article>`;
}
function shelves(list){
  const g=new Map();list.forEach(d=>{if(!g.has(d.store))g.set(d.store,[]);g.get(d.store).push(d)});
  const arr=[...g.entries()].map(([co,ds])=>({co,ds:ds.sort(dsort)}));
  const first=x=>{const u=x.ds.find(d=>!isUsed(d));return u?(u.days??1e4):2e4};
  arr.sort((a,b)=>st.sort==='exp'?first(a)-first(b):st.sort==='count'?b.ds.length-a.ds.length||first(a)-first(b):S[a.co].name.localeCompare(S[b.co].name,'zh-Hant'));
  return arr.map(x=>`<section class="shelf">
    <div class="shelf-head">${logo(x.co)}<div><h2>${esc(S[x.co].name)}</h2><div class="meta">${SUBNAME[S[x.co].sub]||''}</div></div>
    <div class="count"><b>${x.ds.length}</b>張</div></div>
    <div class="tickets">${x.ds.map(d=>ticket(d)).join('')}</div></section>`).join('');
}

/* ---------- rail ---------- */
function opts(el,map,isOn,toggle){
  el.innerHTML=Object.entries(map).map(([k,v])=>`<button class="opt" data-k="${k}" aria-pressed="${isOn(k)}">${v}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('.opt');if(b){toggle(b.dataset.k);render()}};
}
function drawRail(pool){
  const n=f=>pool.filter(f).length;
  let h=`<button class="cat" data-c="all" aria-pressed="${st.cat==='all'}">全部<small>${pool.length}</small></button>`;
  let s=`<button class="opt" data-c="all" aria-pressed="${st.cat==='all'}">全部</button>`;
  CATS.forEach(c=>{const on=st.cat===c.id;
    h+=`<button class="cat" data-c="${c.id}" aria-pressed="${on&&st.sub==='all'}">${c.name}<small>${n(d=>d.cat===c.id)}</small></button>`;
    if(on)h+=`<div class="subs">${c.subs.map(([id,nm])=>`<button class="sub" data-c="${c.id}" data-s="${id}" aria-pressed="${st.sub===id}">${nm}<small>${n(d=>d.sub===id)}</small></button>`).join('')}</div>`;
    s+=`<button class="opt" data-c="${c.id}" aria-pressed="${on}">${c.name} ${n(d=>d.cat===c.id)}</button>`});
  if(st.cat!=='all'){const c=CATS.find(x=>x.id===st.cat);s+='<span style="flex:none;width:8px"></span>'+c.subs.map(([id,nm])=>`<button class="opt" data-c="${c.id}" data-s="${id}" aria-pressed="${st.sub===id}">${nm}</button>`).join('')}
  $('cats').innerHTML=h;$('strip').innerHTML=s;
  opts($('f-aud'),AUD,k=>st.aud.has(k),k=>st.aud.has(k)?st.aud.delete(k):st.aud.add(k));
  opts($('f-cond'),COND,k=>st.cond.has(k),k=>st.cond.has(k)?st.cond.delete(k):st.cond.add(k));
  opts($('f-type'),TYPE,k=>st.type===k,k=>st.type=st.type===k?null:k);
  const nSel=st.aud.size+st.cond.size+(st.type?1:0);
  $('fcount').textContent=nSel?`已選 ${nSel} 項`:'';
}
function activePills(){
  const p=[];st.aud.forEach(k=>p.push(['aud',k,AUD[k]]));st.cond.forEach(k=>p.push(['cond',k,COND[k]]));if(st.type)p.push(['type',st.type,TYPE[st.type]]);
  return p.length?`<div class="active">${p.map(([g,k,v])=>`<button class="pill" data-g="${g}" data-k="${k}">${v}<span aria-label="移除">✕</span></button>`).join('')}<button class="clear" data-act="clear">清除全部</button></div>`:'';
}

/* ---------- views ---------- */
function viewExplore(){
  const pool=deals.filter(d=>matchSearch(d)&&matchFilters(d));
  drawRail(pool);
  const list=pool.filter(d=>(st.cat==='all'||d.cat===st.cat)&&(st.sub==='all'||d.sub===st.sub));
  const c=CATS.find(x=>x.id===st.cat);
  const nStores=new Set(list.map(d=>d.store)).size;
  return `<div class="top"><div><h1>${st.sub!=='all'?SUBNAME[st.sub]:c?c.name:'全部優惠'}</h1><p>${nStores} 家店，共 ${list.length} 張優惠</p></div>
    <div class="ctrls"><select id="sort" aria-label="店家排序">
      <option value="exp"${st.sort==='exp'?' selected':''}>最快到期的店家在前</option>
      <option value="count"${st.sort==='count'?' selected':''}>優惠最多的店家在前</option>
      <option value="name"${st.sort==='name'?' selected':''}>依店名</option></select></div></div>
    ${activePills()}
    ${list.length?`<div class="shelves">${shelves(list)}</div>`:`<div class="empty"><b>沒有同時符合這些條件的優惠</b>試著移除一個篩選條件，或換個關鍵字搜尋。${(st.aud.size||st.cond.size||st.type)?'<br><button class="btn" data-act="clear">清除篩選</button>':''}</div>`}`;
}
function viewForYou(){
  if(!st.me||!st.me.length)return `<div class="top"><div><h1>為你推薦</h1><p>先告訴我們你是哪一種使用者。</p></div></div>
    <div class="empty"><b>還沒設定身分</b>選擇學生、上班族、家庭等身分後，這裡會列出專屬你的優惠。<br><button class="btn" data-act="profile">設定我的身分</button></div>`;
  const me=new Set(st.me);
  const pool=deals.filter(d=>matchSearch(d)&&!isUsed(d));
  const mine=pool.filter(d=>d.aud.some(a=>me.has(a)))
    .map(d=>({d,score:d.aud.filter(a=>me.has(a)).length}))
    .sort((a,b)=>b.score-a.score||((a.d.days??1e4)-(b.d.days??1e4))).map(x=>x.d);
  const open=pool.filter(d=>!d.aud.length).sort(dsort).slice(0,8);
  return `<div class="top"><div><h1>為你推薦</h1><p>依你的身分：${st.me.map(a=>AUD[a]).join('、')}　<button class="clear" data-act="profile">修改</button></p></div></div>
    ${mine.length?`<div class="tickets">${mine.map(d=>ticket(d,{showStore:true,matchAud:me})).join('')}</div>`
      :`<div class="empty"><b>目前沒有專屬你身分的優惠</b>新的優惠每天自動更新，晚點再回來看看。</div>`}
    ${open.length?`<h2 class="section-h">不限身分的熱門優惠<small>快到期的在前</small></h2><div class="tickets">${open.map(d=>ticket(d,{showStore:true})).join('')}</div>`:''}`;
}
function viewWallet(){
  const pool=deals.filter(matchSearch);
  const favs=pool.filter(d=>st.fav.has(d.id)&&!isUsed(d)).sort(dsort);
  const used=pool.filter(isUsed).sort((a,b)=>a.cname.localeCompare(b.cname,'zh-Hant'));
  if(!favs.length&&!used.length)return `<div class="top"><div><h1>我的優惠夾</h1><p>收藏和用過的優惠都會放在這裡。</p></div></div>
    <div class="empty"><b>優惠夾是空的</b>在優惠上按星星收藏，或按「標記已使用」記錄用過的券。<br><a class="btn" href="#explore" style="display:inline-block;text-decoration:none">去探索優惠</a></div>`;
  return `<div class="top"><div><h1>我的優惠夾</h1><p>${favs.length} 張收藏中，${used.length} 張已使用。資料存在這台裝置上。</p></div></div>
    <h2 class="section-h">已收藏<small>快到期的在前</small></h2>
    ${favs.length?`<div class="tickets">${favs.map(d=>ticket(d,{showStore:true})).join('')}</div>`:`<p class="hint">還沒有收藏的優惠。</p>`}
    <h2 class="section-h">已使用<small>按「復原」可以放回去</small></h2>
    ${used.length?`<div class="tickets">${used.map(d=>ticket(d,{showStore:true})).join('')}</div>`:`<p class="hint">還沒有用過的優惠。</p>`}`;
}

/* ---------- coupon detail ---------- */
const WEEK='日一二三四五六';
function fmtDate(s){const d=new Date(s+'T00:00:00');return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${WEEK[d.getDay()]}）`}
function device(){const ua=navigator.userAgent;return /Android/i.test(ua)?'android':(/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))?'ios':'desktop'}
function related(d){
  const same=deals.filter(x=>x.store===d.store&&x.id!==d.id).sort(dsort);
  const others=deals.filter(x=>x.store!==d.store&&x.sub===d.sub&&!isUsed(x)).sort(dsort);
  const near=deals.filter(x=>x.store!==d.store&&x.sub!==d.sub&&!isUsed(x)&&(x.type===d.type||x.aud.some(a=>d.aud.includes(a))))
    .sort((a,b)=>b.aud.filter(t=>d.aud.includes(t)).length-a.aud.filter(t=>d.aud.includes(t)).length||dsort(a,b));
  return {same:same.slice(0,4),more:[...others,...near].slice(0,Math.max(3,6-Math.min(same.length,4)))};
}
function relList(title,list){
  if(!list.length)return '';
  return `<div class="rel"><h3>${title}</h3><ul>${list.map(x=>`<li><a href="#c-${x.id}">${logo(x.store,true)}<span class="t">${esc(x.title)}<small>${esc(x.cname)}・${TYPE[x.type]}</small></span><span class="days">${isUsed(x)?'已用':x.days===null?'長期':x.days===0?'今天截止':'剩 '+x.days+' 天'}</span></a></li>`).join('')}</ul></div>`;
}
function detailHTML(d){
  const s=S[d.store],used=isUsed(d),fav=st.fav.has(d.id);
  const site=s.url||`https://${s.domain}/`;
  const dev=device();
  const appUrl=dev==='ios'?s.app_ios:dev==='android'?s.app_android:'';
  const appHref=appUrl||(dev==='android'?`https://play.google.com/store/search?q=${encodeURIComponent(s.name)}&c=apps`:'');
  const wantsApp=d.cond.includes('app');
  // 主要按鈕：兌換網址 → App → 官網；有優惠碼的話，按下去會先複製再前往
  let target,label;
  if(d.redeem_url){target=d.redeem_url;label='前往兌換'}
  else if(wantsApp&&appHref){target=appHref;label=`開啟 ${s.name} App`}
  else{target=site;label=`前往 ${s.name} 官網`}
  if(d.code)label=`複製優惠碼並${label}`;
  const secondary=[];
  if(wantsApp&&appHref&&target!==appHref)secondary.push(`<a class="big secondary" href="${esc(appHref)}" target="_blank" rel="noopener"${d.code?` data-copy="${esc(d.code)}"`:''}>開啟 ${esc(s.name)} App</a>`);
  if(wantsApp&&!appHref)secondary.push(`<p class="hint">這張券要在 ${esc(s.name)} App 裡使用，請在手機的應用程式商店搜尋「${esc(s.name)}」。</p>`);
  if(target!==site)secondary.push(`<a class="big secondary" href="${esc(site)}" target="_blank" rel="noopener">前往 ${esc(s.name)} 官網</a>`);
  // 有效期間：沒有開始日時，用資料收錄日當起點畫進度
  const t=todayStr(),start=d.start||(d.checked_at||'').slice(0,10)||t;
  let pct=null;
  if(d.end){const a=Date.parse(start),b=Date.parse(d.end),n=Date.parse(t);pct=b>a?Math.min(100,Math.max(0,(n-a)/(b-a)*100)):100}
  const hot=d.days!==null&&d.days<=3;
  const left=d.days===null?'長期有效，沒有到期日':d.days===0?'今天是最後一天':`還剩 ${d.days} 天`;
  const rel=related(d);
  return `<div class="p-top">${logo(d.store)}<div><div class="nm">${esc(s.name)}</div><div class="sb">${SUBNAME[s.sub]||''}・${TYPE[d.type]}</div></div>
      <button class="x" data-act="close" aria-label="關閉">✕</button></div>
    ${used?'<div class="p-used">這張優惠已標記為「已使用」。</div>':''}
    <h2 class="p-title" id="p-title">${esc(d.title)}</h2>
    ${d.desc?`<p class="p-desc">${esc(d.desc)}</p>`:''}
    <div class="tags">${d.aud.map(a=>`<span class="tg">${AUD[a]}</span>`).join('')}${d.cond.map(c=>`<span class="tg">${COND[c]}</span>`).join('')}${d.origin==='demo'?'<span class="tg demo">示範</span>':''}</div>
    <div class="period">
      <div class="period-ends"><div><small>開始</small><b>${d.start?fmtDate(d.start):'即日起'}</b></div><div><small>到期</small><b>${d.end?fmtDate(d.end):'長期有效'}</b></div></div>
      ${pct!==null?`<div class="bar${hot?' hot':''}" role="img" aria-label="有效期間已過 ${Math.round(pct)}%"><span style="width:${pct}%"></span><i style="left:${pct}%"></i></div>`:''}
      <div class="left${hot?' hot':''}">${left}</div>
    </div>
    ${d.code?`<div class="codebox"><code>${esc(d.code)}</code><button data-copybtn="${esc(d.code)}">複製</button></div>`:''}
    <div class="acts-big">
      <a class="big primary" href="${esc(target)}" target="_blank" rel="noopener"${d.code?` data-copy="${esc(d.code)}"`:''}>${esc(label)}</a>
      ${secondary.join('')}
    </div>
    <div class="p-row"><button class="use" data-use="${d.id}">${used?'復原為未使用':'標記已使用'}</button>
      <button class="star" data-star="${d.id}" aria-pressed="${fav}">${STAR}${fav?'已收藏':'收藏'}</button></div>
    <div class="p-meta">${d.source?`<a href="${esc(d.source)}" target="_blank" rel="noopener">查看資料來源</a>`:''}
      <a href="https://github.com/${REPO}/issues/new?template=expired.yml&title=${encodeURIComponent('[已失效] '+d.cname+' '+d.title)}&coupon_id=${d.id}" target="_blank" rel="noopener">回報失效</a>
      <span>優惠編號 ${d.id}</span></div>
    ${relList(`${esc(s.name)} 的其他優惠`,rel.same)}
    ${relList('你可能也喜歡',rel.more)}`;
}
function drawDetail(){
  const d=st.detail&&deals.find(x=>x.id===st.detail);
  const sh=$('sheet');
  if(!d){if(!sh.hidden){sh.hidden=true;document.body.style.overflow=''}return}
  const wasHidden=sh.hidden,prevScroll=$('panel').scrollTop,same=$('panel').dataset.id===d.id;
  $('panel').innerHTML=detailHTML(d);$('panel').dataset.id=d.id;
  sh.hidden=false;document.body.style.overflow='hidden';
  if(same)$('panel').scrollTop=prevScroll;else{$('panel').scrollTop=0;$('panel').focus({preventScroll:true})}
}
function closeDetail(){st.detail=null;location.hash=st.view}
function copyCode(code,el,msg){
  const fb=()=>{if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('請手動複製優惠碼：'+code)};
  try{navigator.clipboard.writeText(code).then(()=>toast(msg||('已複製 '+code)),fb)}catch(err){fb()}
}

function render(){
  if(!DATA)return;
  document.querySelectorAll('.view').forEach(a=>{if(a.dataset.v===st.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('rail').hidden=st.view!=='explore';
  $('shell').classList.toggle('single',st.view!=='explore');
  $('main').innerHTML=st.view==='for-you'?viewForYou():st.view==='wallet'?viewWallet():viewExplore();
  const live=new Set(deals.map(d=>d.id));
  $('walletN').textContent=[...new Set([...st.fav,...st.used])].filter(id=>live.has(id)).length;
  $('meBtn').innerHTML=st.me&&st.me.length?`我是：<b>${st.me.map(a=>AUD[a]).join('、')}</b>`:'設定我的身分';
  drawDetail();
}
function drawProfile(){
  $('pf-opts').innerHTML=Object.entries(AUD).map(([k,v])=>`<button class="opt" data-pf="${k}" aria-pressed="${st.draft.has(k)}">${v}</button>`).join('');
}
function openProfile(open){
  st.draft=new Set(st.me||[]);drawProfile();
  $('profile').hidden=!open;$('meBtn').setAttribute('aria-expanded',open);
  if(open)window.scrollTo({top:0});
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const cb=t.closest('[data-c]');
  if(cb&&(cb.closest('#cats')||cb.closest('#strip'))){st.cat=cb.dataset.c;st.sub=cb.dataset.s||'all';render();return}
  const pill=t.closest('.pill');
  if(pill){const{g,k}=pill.dataset;g==='type'?st.type=null:st[g].delete(k);render();return}
  const act=t.closest('[data-act]')?.dataset.act;
  if(act==='clear'){st.aud.clear();st.cond.clear();st.type=null;render();return}
  if(act==='profile'){openProfile(true);return}
  const pf=t.closest('[data-pf]');
  if(pf){const k=pf.dataset.pf;st.draft.has(k)?st.draft.delete(k):st.draft.add(k);drawProfile();return}
  const sb=t.closest('[data-star]');
  if(sb){const id=sb.dataset.star;st.fav.has(id)?st.fav.delete(id):st.fav.add(id);saveMarks();toast(st.fav.has(id)?'已收藏到優惠夾':'已取消收藏');render();return}
  const ub=t.closest('[data-use]');
  if(ub){const id=ub.dataset.use;if(st.used.has(id)){st.used.delete(id);toast('已復原')}else{st.used.add(id);toast('已標記為已使用')}saveMarks();render();return}
  if(act==='close'){closeDetail();return}
  const cd=t.closest('.code');
  if(cd){copyCode(cd.dataset.code,cd);return}
  const cb2=t.closest('[data-copybtn]');
  if(cb2){copyCode(cb2.dataset.copybtn,cb2.parentElement.querySelector('code'));return}
  const go=t.closest('a[data-copy]');
  if(go){copyCode(go.dataset.copy,null,`已複製 ${go.dataset.copy}，正在前往…`);return}  // 不擋連結，複製後照常開新分頁
  const card=t.closest('[data-open]');
  if(card&&!t.closest('a,button')){location.hash='c-'+card.dataset.open}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeDetail()});
document.addEventListener('change',e=>{if(e.target.id==='sort'){st.sort=e.target.value;render()}});
$('q').oninput=e=>{st.q=e.target.value.trim();render()};
$('meBtn').onclick=()=>openProfile($('profile').hidden);
$('pf-cancel').onclick=()=>openProfile(false);
$('pf-save').onclick=()=>{st.me=[...st.draft];ls.set('me',st.me);openProfile(false);toast(st.me.length?'已儲存你的身分':'已清除身分');location.hash='for-you';route()};
function route(){
  const h=location.hash.slice(1);
  if(h.startsWith('c-')){st.detail=h.slice(2)}           // 優惠詳情：背景維持原本的頁面
  else{st.detail=null;st.view=['explore','for-you','wallet'].includes(h)?h:'explore'}
  render();
}
window.addEventListener('hashchange',route);

$('foot').innerHTML=`發現新優惠？<a href="https://github.com/${REPO}/issues/new?template=new-coupon.yml" target="_blank" rel="noopener">回報給我們</a>。品牌名稱與商標屬各品牌所有，優惠內容以官方公告為準。`;

fetch('data/coupons.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{
  prepare(data);
  const u=data.updated_at?new Date(data.updated_at):null;
  const demo=data.coupons.some(c=>c.origin==='demo');
  $('note').innerHTML=(demo?'<b>示範版</b>標有「示範」的優惠是虛構資料。':'')+(u?`資料更新於 ${u.getMonth()+1}/${u.getDate()} ${String(u.getHours()).padStart(2,'0')}:${String(u.getMinutes()).padStart(2,'0')}，每天早上 6 點自動更新。`:'');
  route();
}).catch(()=>{$('main').innerHTML='<div class="empty"><b>優惠資料載入失敗</b>請重新整理頁面；如果一直失敗，代表 data/coupons.json 不見或格式有誤。</div>'});
</script>
</body>
</html>
